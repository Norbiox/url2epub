# Add this service to the same compose project / network as n8n.
services:
  url2epub:
    image: ghcr.io/norbiox/url2epub:latest
    # build: .   # alternatively build locally
    container_name: url2epub
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # No published ports: n8n reaches it as http://url2epub:8000 on the shared network.
    # Uncomment to call it directly (e.g. for debugging):
    # ports:
    #   - "8000:8000"
